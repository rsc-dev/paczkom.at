<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Polish, to match `lang` on the document. -->
    <meta name="description" content="Jakość powietrza w Twoim mieście, co godzinę." />
    <meta name="theme-color" content="#f2efe8" />
    <!-- Link previews. Absolute URLs: unfurlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="paczkom.at" />
    <meta property="og:title" content="paczkom.at" />
    <meta property="og:description" content="Jakość powietrza w Twoim mieście, co godzinę." />
    <meta property="og:url" content="https://paczkom.at/" />
    <meta property="og:image" content="https://paczkom.at/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ściana skrytek paczkowych, jedne drzwiczki pomarańczowe" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>paczkom.at · Jakość powietrza w Twoim mieście, co godzinę.</title>
  </head>
  <body>
    <div id="app" data-screen="loading">
      <header class="top">
        <a class="brand" href="/">paczkom<span class="brand__dot">.</span>at</a>
        <button class="btn btn--ghost btn--small" id="btn-lang"></button>
      </header>

      <p class="notice" id="notice-retired" data-t="game.retired" hidden></p>
      <p class="notice notice--warn" id="notice-stale" hidden></p>

      <section class="screen" id="screen-loading"><p data-t="load.loading"></p></section>

      <section class="screen" id="screen-error">
        <p data-t="load.failed"></p>
        <button class="btn btn--primary" id="btn-retry" data-t="load.retry"></button>
      </section>

      <!-- ------------------------------------------------------ picker -->
      <section class="screen" id="screen-picker" aria-labelledby="picker-title">
        <h1 class="screen__title" id="picker-title" data-t="picker.title"></h1>
        <p class="tagline" data-t="app.tagline"></p>
        <label class="visually-hidden" for="picker-input" data-t="picker.placeholder"></label>
        <input class="picker__input" id="picker-input" type="search" autocomplete="off" spellcheck="false" />
        <ul class="picker__results" id="picker-results"></ul>
        <p class="picker__empty" id="picker-empty" data-t="picker.noMatch" hidden></p>
        <button class="btn btn--ghost" id="btn-locate" data-t="picker.locate"></button>
        <p class="picker__status" id="picker-status" role="status"></p>
      </section>

      <section class="screen" id="screen-card" aria-labelledby="card-town">
        <h1 class="screen__title" id="card-town"></h1>
        <div class="level" id="card-level">
          <span class="level__label" id="card-level-label"></span>
          <span class="level__of" id="card-level-of"></span>
        </div>
        <p class="card__line" id="card-pm"></p>
        <p class="card__line" id="card-trend"></p>
        <p class="card__line" id="card-worst"></p>
        <p class="card__line" id="card-percentile"></p>
        <p class="card__source" id="card-source"></p>
        <div class="actions">
          <button class="btn btn--primary" id="btn-share" data-t="card.share"></button>
          <button class="btn btn--ghost" id="btn-make-mine" data-t="card.makeMine" hidden></button>
          <button class="btn btn--ghost" id="btn-change" data-t="card.change"></button>
          <button class="btn btn--ghost" id="btn-ranking" data-t="card.ranking"></button>
        </div>
        <p class="card__note" id="share-note" role="status"></p>
        <textarea class="card__fallback" id="share-fallback" readonly hidden></textarea>
      </section>

      <section class="screen" id="screen-ranking" aria-labelledby="ranking-title">
        <h1 class="screen__title" id="ranking-title" data-t="ranking.title"></h1>
        <p class="card__line" id="ranking-median"></p>
        <h2 class="ranking__heading" data-t="ranking.best"></h2>
        <ol class="ranking__list" id="ranking-best"></ol>
        <h2 class="ranking__heading" data-t="ranking.worst"></h2>
        <ol class="ranking__list" id="ranking-worst"></ol>
        <ul class="ranking__counts" id="ranking-counts"></ul>
        <button class="btn btn--ghost" id="btn-ranking-back" data-t="ranking.back"></button>
      </section>

      <footer class="foot"><small data-t="footer.attribution"></small></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
