name: Deploy

# After a green CI on main, every hour at :25 (GIOŚ publishes its index around
# :20), and on demand. Every run builds, collects fresh data and deploys; a
# collect that cannot grade enough towns fails the run and the last hour stays
# live. Pages source must be "GitHub Actions".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # After CI: the commit CI passed. Hourly and manual: main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The newest saved history; a miss starts fresh.
      - uses: actions/cache/restore@v4
        with:
          path: .history
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Collect
        run: npm run collect

      - uses: actions/cache/save@v4
        with:
          path: .history
          key: history-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
