name: Keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# activity. One commit a month keeps the hourly deploy running.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: keep the hourly schedule alive'
          git push
